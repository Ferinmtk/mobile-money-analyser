{% set name = "mobile-money-analyzer" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mobile_money_analyzer-{{ version }}.tar.gz
  # Fill in after the first PyPI release:
  #   curl -sL <sdist-url> | sha256sum
  sha256: FILL_IN_AFTER_PYPI_RELEASE

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - mobile-money = mobile_money.cli:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - pip
  run:
    - python >={{ python_min }}
    - pandas >=2.0
    - pdfplumber >=0.11

test:
  imports:
    - mobile_money
  commands:
    - pip check
    - mobile-money --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/Ferinmtk/mobile-money-analyser
  summary: Parse M-Pesa and Airtel Money PDF statements and analyse spending
  description: |
    A free, offline statement analyser for Kenyan mobile money. Parses the
    PDF statements that Safaricom (M-Pesa), Airtel Money, and T-Kash email
    each month into categorised transaction data, with a CLI, an optional
    Streamlit dashboard, and CSV export. Runs fully offline — no uploads,
    no accounts, no third party.
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/Ferinmtk/mobile-money-analyser#readme
  dev_url: https://github.com/Ferinmtk/mobile-money-analyser

extra:
  recipe-maintainers:
    - Ferinmtk
